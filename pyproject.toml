[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-press"
version = "1.0.0"
description = "Bench Press: journalism codes of ethics as a benchmark for language models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT (code); CC BY 4.0 (data)" }
dependencies = [
    "openai>=1.40",
    "numpy>=1.22",
    "pandas>=1.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
test = ["pytest>=7"]

[project.scripts]
benchpress = "benchpress.cli:main"

[tool.setuptools]
packages = ["benchpress"]
